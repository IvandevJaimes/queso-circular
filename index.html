<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#fafaf9" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Queso Circular" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Queso Circular IA — Valorización de Lactosuero</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('queso-circular-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', isDark ? '#09090b' : '#fafaf9');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-zinc-900 antialiased selection:bg-amber-500/20 selection:text-amber-950 dark:bg-zinc-950 dark:text-zinc-100 dark:selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
